<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΕΓΓΡΑΦΗ | OmniChat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0f0f 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Κομψό abstract background */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .shape-1 {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            left: -150px;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.02);
            border: 2px dashed rgba(255,255,255,0.03);
        }

        /* Κεντρικό Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 460px;
            padding: 50px 40px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                0 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 40px 70px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        }

        /* Header με logo */
        .card-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 
                0 15px 25px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.05) inset;
        }

        .logo i {
            font-size: 36px;
            color: rgba(255,255,255,0.9);
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .card-header h1 {
            color: rgba(255,255,255,0.95);
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .card-header p {
            color: rgba(255,255,255,0.4);
            font-size: 15px;
            font-weight: 400;
        }

        /* Φόρμα */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 18px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 18px 18px 18px 52px;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            font-size: 15px;
            color: rgba(255,255,255,0.9);
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3);
        }

        .input-wrapper input:focus {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(20, 20, 20, 0.9);
            box-shadow: 
                0 0 0 3px rgba(255,255,255,0.02),
                inset 0 4px 8px rgba(0,0,0,0.4);
        }

        .input-wrapper input:focus + i {
            color: rgba(255,255,255,0.7);
        }

        .input-wrapper input::placeholder {
            color: rgba(255,255,255,0.2);
            font-weight: 300;
        }

        /* Κουμπί σύνδεσης */
        .login-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(145deg, #2c2c2c, #1e1e1e);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px;
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            box-shadow: 
                0 15px 25px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255,255,255,0.02) inset;
        }

        .login-btn:hover {
            background: linear-gradient(145deg, #333333, #252525);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 
                0 20px 30px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255,255,255,0.03) inset;
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Σύνδεσμοι */
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
        }

        .links a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
            border-bottom: 1px dotted transparent;
        }

        .links a:hover {
            color: rgba(255,255,255,0.8);
            border-bottom-color: rgba(255,255,255,0.2);
        }

        /* Διαχωριστική γραμμή */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0 20px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .divider span {
            padding: 0 15px;
            color: rgba(255,255,255,0.25);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Σύνδεση με social (αν θες) */
        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            background: rgba(15, 15, 15, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.4);
            font-size: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-btn:hover {
            background: rgba(30, 30, 30, 0.8);
            color: rgba(255,255,255,0.9);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }

        /* Error message */
        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 107, 107, 0.05);
            border: 1px solid rgba(255, 107, 107, 0.2);
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-card {
                width: 90%;
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-card">
        <div class="card-header">
            <div class="logo">
                <i class="fas fa-comments"></i>
            </div>
            <h1>OmniChat</h1>
            <p>Συνδέσου για να συνομιλήσεις</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Όνομα χρήστη" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Κωδικός πρόσβασης" required>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> Σύνδεση
            </button>

            <div class="links">
                <a href="register.html">Δεν έχω λογαριασμό</a>
                <a href="#">Ξέχασα τον κωδικό</a>
            </div>

            <div class="divider">
                <span>Ή σύνδεση με</span>
            </div>

            <div class="social-login">
                <div class="social-btn"><i class="fab fa-google"></i></div>
                <div class="social-btn"><i class="fab fa-github"></i></div>
                <div class="social-btn"><i class="fab fa-discord"></i></div>
            </div>
        </form>

        <div id="error" class="error"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.querySelector('.login-btn');
            
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Σύνδεση...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    btn.style.background = '#2c2c2c';
                    btn.innerHTML = '<i class="fas fa-check"></i> Επιτυχία!';
                    
                    setTimeout(() => {
                        window.location.href = '/chat.html';
                    }, 500);
                } else {
                    errorDiv.textContent = data.error || 'Σφάλμα σύνδεσης';
                    errorDiv.classList.add('show');
                    
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Σύνδεση';
                }
            } catch (err) {
                errorDiv.textContent = 'Σφάλμα δικτύου';
                errorDiv.classList.add('show');
                
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Σύνδεση';
            }
        });
    </script>
</body>
</html>
