<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Εγγραφή | NEBULA CHAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
            color: #0f0;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0,20,0,0.2) 0%, rgba(0,0,0,0.9) 90%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 440px;
            margin: 60px auto;
            padding: 40px 30px;
            background: rgba(5, 8, 5, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 0, 0.25);
            border-radius: 24px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.8),
                0 0 30px rgba(0, 255, 0, 0.2),
                inset 0 0 20px rgba(0, 255, 0, 0.1);
            animation: borderPulse 6s infinite alternate;
        }

        @keyframes borderPulse {
            0% { border-color: rgba(0, 255, 0, 0.15); box-shadow: 0 0 20px rgba(0, 255, 0, 0.1); }
            100% { border-color: rgba(0, 255, 0, 0.4); box-shadow: 0 0 40px rgba(0, 255, 0, 0.3); }
        }

        .glitch-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #0f0;
            text-transform: uppercase;
            letter-spacing: 6px;
            position: relative;
            animation: glitchSkew 4s infinite linear;
            text-shadow: 
                0 0 5px #0f0,
                2px 2px 0 #0ff,
                -2px -2px 0 #f0f;
        }

        @keyframes glitchSkew {
            0%, 100% { transform: skew(0deg, 0deg); }
            10% { transform: skew(1deg, 0.5deg); filter: hue-rotate(10deg); }
            20% { transform: skew(-0.5deg, 1deg); filter: hue-rotate(-5deg); }
            30% { transform: skew(0.8deg, -0.3deg); }
            40% { transform: skew(-0.3deg, -0.8deg); }
            50% { transform: skew(0.2deg, 0.5deg); }
            60% { transform: skew(-0.7deg, 0.2deg); }
        }

        .glitch-title span {
            display: inline-block;
            animation: glitchText 0.8s infinite;
        }

        @keyframes glitchText {
            0%, 100% { opacity: 1; transform: translate(0,0); }
            33% { opacity: 0.8; transform: translate(-2px, 1px); color: #0ff; }
            66% { opacity: 0.9; transform: translate(2px, -1px); color: #f0f; }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #0f0;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
            opacity: 0.7;
            text-shadow: 0 0 3px #0f0;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #0f0;
            font-size: 18px;
            opacity: 0.6;
            text-shadow: 0 0 5px #0f0;
            transition: all 0.3s ease;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 48px;
            background: rgba(0, 10, 0, 0.7);
            border: 1px solid #0f0;
            border-radius: 40px;
            font-size: 15px;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 
                inset 0 0 10px rgba(0,0,0,0.5),
                0 0 15px rgba(0, 255, 0, 0.2);
            letter-spacing: 1px;
        }

        .input-wrapper input:focus {
            border-color: #0f0;
            box-shadow: 
                0 0 25px #0f0,
                inset 0 0 15px rgba(0, 255, 0, 0.3);
            background: rgba(0, 15, 0, 0.8);
            transform: scale(1.02);
        }

        .input-wrapper input:focus + i {
            opacity: 1;
            text-shadow: 0 0 10px #0f0;
        }

        .input-wrapper input::placeholder {
            color: rgba(0, 255, 0, 0.25);
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .cyber-btn {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: 2px solid #0f0;
            border-radius: 40px;
            color: #0f0;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            font-family: 'Share Tech Mono', monospace;
            margin-top: 25px;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }

        .cyber-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 40px #0f0;
            text-shadow: 0 0 5px #000;
            letter-spacing: 6px;
        }

        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,0,0.4), transparent);
            transition: 0.5s;
        }

        .cyber-btn:hover::before {
            left: 100%;
        }

        .links {
            text-align: center;
            margin: 20px 0 15px;
            font-size: 13px;
        }

        .links a {
            color: rgba(0, 255, 0, 0.6);
            text-decoration: none;
            border-bottom: 1px dashed rgba(0,255,0,0.3);
            padding-bottom: 2px;
            transition: 0.3s;
        }

        .links a:hover {
            color: #0f0;
            border-bottom-color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        .glitch-text {
            font-size: 11px;
            text-align: center;
            color: rgba(0,255,0,0.3);
            letter-spacing: 2px;
            margin-top: 20px;
            text-transform: uppercase;
            position: relative;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        .glitch-text::before {
            color: #f0f;
            z-index: -1;
            transform: translate(-2px, -1px);
        }

        .glitch-text::after {
            color: #0ff;
            z-index: -2;
            transform: translate(2px, 1px);
        }

        .error {
            color: #f0f;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #f0f;
            border-radius: 20px;
            background: rgba(255,0,255,0.05);
            text-shadow: 0 0 5px #f0f;
            display: none;
            font-size: 14px;
        }

        .error.show {
            display: block;
            animation: glitchError 0.3s;
        }

        @keyframes glitchError {
            0% { transform: translate(2px, -1px); opacity: 0.5; }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(1px, -2px); }
            60% { transform: translate(-1px, 2px); }
            80% { transform: translate(2px, 1px); }
            100% { transform: translate(0,0); }
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #0f0;
            box-shadow: 0 0 10px #0f0;
            border-radius: 50%;
            opacity: 0.5;
            animation: floatParticle 10s linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }

        @media (max-width: 500px) {
            .container {
                margin: 40px 20px;
                padding: 30px 20px;
            }
            
            .glitch-title {
                font-size: 26px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="overlay"></div>
    <div id="particles"></div>

    <div class="container">
        <h1 class="glitch-title">
            <span>R</span><span>E</span><span>G</span><span>I</span><span>S</span><span>T</span><span>E</span><span>R</span>
        </h1>

        <form id="registerForm">
            <div class="input-group">
                <label for="username">> USERNAME</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="CHOOSE YOUR ID" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">> EMAIL</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="ENTER YOUR EMAIL" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">> PASSWORD</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="CREATE ACCESS CODE" required>
                </div>
            </div>

            <button type="submit" class="cyber-btn">
                <i class="fas fa-user-plus" style="margin-right: 8px;"></i> INITIALIZE
            </button>

            <div class="links">
                <a href="login.html">[ BACK TO LOGIN ]</a>
            </div>

            <div class="glitch-text" data-text="JOIN THE SYSTEM">
                JOIN THE SYSTEM
            </div>
        </form>

        <div id="error" class="error"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrix = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
        const matrixArray = matrix.split("");
        const fontSize = 14;
        const columns = canvas.width / fontSize;

        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = Math.floor(Math.random() * canvas.height);
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 30);

        function createParticles() {
            const particlesDiv = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.background = i % 3 === 0 ? '#0f0' : (i % 3 === 1 ? '#f0f' : '#0ff');
                particle.style.boxShadow = particle.style.background + ' 0 0 10px';
                particlesDiv.appendChild(particle);
            }
        }
        createParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.querySelector('.cyber-btn');
            
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> INITIALIZING...';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    btn.style.background = '#0f0';
                    btn.style.color = '#000';
                    btn.innerHTML = '<i class="fas fa-check"></i> ACCOUNT CREATED';
                    
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 500);
                } else {
                    errorDiv.textContent = '> ERROR: ' + (data.error || 'Registration failed');
                    errorDiv.classList.add('show');
                    
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> INITIALIZE';
                }
            } catch (err) {
                errorDiv.textContent = '> SYSTEM ERROR: Connection failed';
                errorDiv.classList.add('show');
                
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = '<i class="fas fa-user-plus"></i> INITIALIZE';
            }
        });
    </script>
</body>
</html>
