<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Room</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-comments"></i> Chat App</h3>
                <button id="closeSidebar" class="mobile-only"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- User Profile -->
            <div class="user-profile" id="userProfile">
                <img id="userAvatar" src="/images/default-avatar.svg" alt="avatar" class="avatar">
                <div class="user-info">
                    <span id="currentUsername"></span>
                    <div class="user-status">
                        <span class="status-dot available"></span>
                        <span id="userStatus">available</span>
                    </div>
                </div>
                <button id="editProfileBtn" class="icon-btn"><i class="fas fa-edit"></i></button>
            </div>
            
            <!-- Profile Edit Modal -->
            <div id="profileModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <h3>Edit Profile</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Status:</label>
                            <select id="statusSelect">
                                <option value="available">Available</option>
                                <option value="away">Away</option>
                                <option value="busy">Busy</option>
                                <option value="offline">Offline</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Custom Status:</label>
                            <input type="text" id="customStatus" placeholder="e.g., Gaming...">
                        </div>
                        <div class="form-group">
                            <label>Avatar:</label>
                            <input type="file" id="avatarInput" accept="image/*">
                        </div>
                        <button type="submit" class="btn">Save</button>
                        <button type="button" id="closeProfileModal" class="btn secondary">Cancel</button>
                    </form>
                </div>
            </div>
            
            <!-- Rooms -->
            <div class="rooms-section">
                <h4><i class="fas fa-door-open"></i> Rooms 
                    <button id="createRoomBtn" class="icon-btn"><i class="fas fa-plus"></i></button>
                </h4>
                <div id="rooms-list"></div>
            </div>
            
            <!-- Users -->
            <div class="users-section">
                <h4><i class="fas fa-users"></i> Online Users <span id="onlineCount">0</span></h4>
                <div id="users-list"></div>
            </div>
        </div>
        
        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <button id="menuToggle" class="mobile-only"><i class="fas fa-bars"></i></button>
                <h2 id="currentRoom">general</h2>
                <div class="header-actions">
                    <button id="adminBtn" class="icon-btn admin-only" title="Admin Panel" style="display: none;">
                        <i class="fas fa-shield-alt"></i>
                    </button>
                    <button id="clearAllBtn" class="icon-btn admin-only" title="Διαγραφή όλων (Admin only)" style="display: none;">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <button id="soundToggle" class="icon-btn" title="Ήχος">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <button id="themeToggle" class="icon-btn" title="Dark/Light mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="clearChat" class="icon-btn" title="Clear chat">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button id="logoutBtn" class="icon-btn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                <div id="typing-indicator"></div>
            </div>
            
            <div id="messages" class="messages-area"></div>
            
            <!-- Message Input -->
            <div class="input-area">
                <button id="emojiBtn" class="emoji-btn" title="Emojis">
                    <i class="far fa-smile"></i>
                </button>
                <button id="fileBtn" class="file-btn" title="Attach file">
                    <i class="fas fa-paperclip"></i>
                </button>
                <input type="file" id="fileInput" style="display:none;">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Emoji Picker -->
    <div id="emojiPicker" class="emoji-picker" style="display:none;">
        <span class="emoji" onclick="addEmoji('😊')">😊</span>
        <span class="emoji" onclick="addEmoji('😂')">😂</span>
        <span class="emoji" onclick="addEmoji('❤️')">❤️</span>
        <span class="emoji" onclick="addEmoji('👍')">👍</span>
        <span class="emoji" onclick="addEmoji('🎉')">🎉</span>
        <span class="emoji" onclick="addEmoji('🔥')">🔥</span>
        <span class="emoji" onclick="addEmoji('😎')">😎</span>
        <span class="emoji" onclick="addEmoji('🥳')">🥳</span>
        <span class="emoji" onclick="addEmoji('😢')">😢</span>
        <span class="emoji" onclick="addEmoji('😡')">😡</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
