<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Chat App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
        }
        
        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .users-table th {
            background: #f7fafc;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #4a5568;
        }
        
        .users-table td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .users-table tr:hover {
            background: #f7fafc;
        }
        
        .role-select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #cbd5e0;
        }
        
        .delete-btn {
            color: #e53e3e;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .delete-btn:hover {
            background: #fff5f5;
        }
        
        .save-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .save-btn:hover {
            background: #38a169;
        }
        
        .top-users {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        
        .top-user-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .status-dot.available { background: #48bb78; }
        .status-dot.away { background: #ecc94b; }
        .status-dot.busy { background: #f56565; }
        .status-dot.offline { background: #a0aec0; }

        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 5px;
        }

        .btn.secondary {
            background: #718096;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
            <div>
                <a href="/chat.html" class="btn"><i class="fas fa-arrow-left"></i> Back to Chat</a>
                <button id="logoutBtn" class="btn secondary"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        
        <div id="stats" class="stats-grid">
            <!-- Stats will be loaded here -->
        </div>
        
        <h2><i class="fas fa-users"></i> User Management</h2>
        <table class="users-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Messages</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Users will be loaded here -->
            </tbody>
        </table>
        
        <div class="top-users" id="topUsers">
            <h3><i class="fas fa-chart-bar"></i> Top Active Users</h3>
            <div id="topUsersList"></div>
        </div>
    </div>

    <script>
        // Check if user is admin
        fetch('/api/check-auth')
            .then(res => res.json())
            .then(data => {
                if (!data.authenticated) {
                    window.location.href = '/login.html';
                } else if (data.role !== 'admin') {
                    alert('Access denied. Admin only!');
                    window.location.href = '/chat.html';
                }
            })
            .catch(() => {
                window.location.href = '/login.html';
            });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        });

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const stats = await response.json();
                
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="number">${stats.totalUsers}</div>
                        <div class="label">Total Users</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.onlineUsers}</div>
                        <div class="label">Online Now</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.totalMessages}</div>
                        <div class="label">Total Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.messagesToday}</div>
                        <div class="label">Messages Today</div>
                    </div>
                    <div class="stat-card">
                        <div class="number">${stats.totalRooms}</div>
                        <div class="label">Chat Rooms</div>
                    </div>
                `;
                
                // Top users
                const topUsersList = document.getElementById('topUsersList');
                topUsersList.innerHTML = stats.topUsers.map(user => `
                    <div class="top-user-item">
                        <span><strong>${user._id}</strong></span>
                        <span>${user.count} messages</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Error loading stats:', err);
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const users = await response.json();
                
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = users.map(user => `
                    <tr id="user-${user._id}">
                        <td><i class="fas fa-user"></i> ${user.username}</td>
                        <td>${user.email || '-'}</td>
                        <td>
                            <select class="role-select" data-userid="${user._id}" data-current="${user.role}">
                                <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                                <option value="moderator" ${user.role === 'moderator' ? 'selected' : ''}>Moderator</option>
                                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                            </select>
                        </td>
                        <td>
                            <span class="status-dot ${user.isOnline ? 'available' : 'offline'}"></span>
                            ${user.isOnline ? 'Online' : 'Offline'}
                        </td>
                        <td>-</td>
                        <td>
                            <button class="save-btn" onclick="updateRole('${user._id}')" style="display:none;">Save</button>
                            <i class="fas fa-trash delete-btn" onclick="deleteUser('${user._id}', '${user.username}')"></i>
                        </td>
                    </tr>
                `).join('');
                
                // Add event listeners for role changes
                document.querySelectorAll('.role-select').forEach(select => {
                    select.addEventListener('change', function() {
                        const saveBtn = this.closest('tr').querySelector('.save-btn');
                        saveBtn.style.display = 'inline-block';
                    });
                });

            } catch (err) {
                console.error('Error loading users:', err);
            }
        }

        // Update user role
        window.updateRole = async function(userId) {
            const select = document.querySelector(`select[data-userid="${userId}"]`);
            const role = select.value;
            
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ role })
            });
            
            if (response.ok) {
                alert('Role updated successfully!');
                location.reload();
            } else {
                alert('Error updating role');
            }
        };

        // Delete user
        window.deleteUser = async function(userId, username) {
            if (!confirm(`Are you sure you want to delete user ${username}?`)) return;
            
            const response = await fetch(`/api/admin/users/${userId}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                document.getElementById(`user-${userId}`).remove();
                alert('User deleted!');
                loadStats(); // Reload stats
            } else {
                alert('Error deleting user');
            }
        };

        // Initial load
        loadStats();
        loadUsers();
    </script>
</body>
</html>
