<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση | Blacksheep</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0f12 0%, #1a1e24 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Κομψό abstract background */
        .bg-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 50%;
            filter: blur(60px);
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -100px;
            background: rgba(0, 200, 255, 0.05);
        }

        .shape-2 {
            width: 350px;
            height: 350px;
            bottom: -100px;
            left: -100px;
            background: rgba(255, 100, 200, 0.05);
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.02);
            filter: blur(80px);
        }

        /* Κύρια κάρτα */
        .card {
            position: relative;
            z-index: 10;
            width: 440px;
            padding: 50px 40px;
            background: rgba(20, 24, 28, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.6);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #2a2f36, #1c2128);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 
                0 15px 25px rgba(0,0,0,0.3),
                0 0 0 1px rgba(255,255,255,0.03) inset;
        }

        .logo i {
            font-size: 34px;
            color: #6c8cff;
            filter: drop-shadow(0 0 12px rgba(108, 140, 255, 0.3));
        }

        .header h1 {
            color: #ffffff;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            color: #8a919e;
            font-size: 15px;
            font-weight: 400;
        }

        /* Φόρμα */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #a0a8b7;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f6778;
            font-size: 18px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 18px 16px 52px;
            background: #1a1f27;
            border: 1px solid #2c323d;
            border-radius: 18px;
            font-size: 15px;
            color: #ffffff;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
        }

        .input-wrapper input:focus {
            border-color: #6c8cff;
            background: #1e232c;
            box-shadow: 
                0 0 0 4px rgba(108, 140, 255, 0.1),
                inset 0 4px 8px rgba(0,0,0,0.3);
        }

        .input-wrapper input:focus + i {
            color: #6c8cff;
        }

        .input-wrapper input::placeholder {
            color: #3f4756;
            font-weight: 400;
        }

        /* Κουμπί */
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #2f3540, #242932);
            border: 1px solid #3a4150;
            border-radius: 22px;
            color: #e0e5f0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            box-shadow: 
                0 15px 25px rgba(0,0,0,0.3),
                0 0 0 1px rgba(255,255,255,0.02) inset;
        }

        .btn:hover {
            background: linear-gradient(145deg, #353c48, #2b313e);
            border-color: #4e5768;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Σύνδεσμοι */
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 14px;
        }

        .links a {
            color: #7e8799;
            text-decoration: none;
            transition: color 0.3s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }

        .links a:hover {
            color: #6c8cff;
            border-bottom-color: #6c8cff;
        }

        /* Διαχωριστική γραμμή */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0 20px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .divider span {
            padding: 0 15px;
            color: #4f5768;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Social buttons */
        .social {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            background: #1a1f27;
            border: 1px solid #2c323d;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c7a92;
            font-size: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-btn:hover {
            background: #232a34;
            color: #6c8cff;
            border-color: #3d4659;
            transform: translateY(-3px);
        }

        /* Error message */
        .error {
            color: #ff6b8b;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 107, 139, 0.05);
            border: 1px solid rgba(255, 107, 139, 0.2);
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .error.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                width: 90%;
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="card">
        <div class="header">
            <div class="logo">
                <i class="fas fa-comment-dots"></i>
            </div>
            <h1>Καλωσήρθες</h1>
            <p>Συνδέσου για να συνομιλήσεις</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Όνομα χρήστη" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Κωδικός πρόσβασης" required>
                </div>
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> Σύνδεση
            </button>

            <div class="links">
                <a href="register.html">Δημιουργία λογαριασμού</a>
                <a href="#">Ξέχασες τον κωδικό;</a>
            </div>

            <div class="divider">
                <span>ή σύνδεση με</span>
            </div>

            <div class="social">
                <div class="social-btn"><i class="fab fa-google"></i></div>
                <div class="social-btn"><i class="fab fa-github"></i></div>
                <div class="social-btn"><i class="fab fa-discord"></i></div>
            </div>
        </form>

        <div id="error" class="error"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.querySelector('.btn');
            
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Σύνδεση...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    btn.innerHTML = '<i class="fas fa-check"></i> Επιτυχία!';
                    setTimeout(() => {
                        window.location.href = '/chat.html';
                    }, 500);
                } else {
                    errorDiv.textContent = data.error || 'Σφάλμα σύνδεσης';
                    errorDiv.classList.add('show');
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Σύνδεση';
                }
            } catch (err) {
                errorDiv.textContent = 'Σφάλμα δικτύου';
                errorDiv.classList.add('show');
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Σύνδεση';
            }
        });
    </script>
</body>
</html>
